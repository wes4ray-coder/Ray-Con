<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92" role="img" aria-label="Skid steer">
  <!-- Original drawing: yellow compact track skid steer, 3/4 front view, bucket left.
       Bold black outline style. -->
  <g stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground shadow -->
    <path d="M10 84 L112 78 L104 86 L22 89 Z" fill="#1a1a1a" stroke="none" opacity=".85"/>
    <!-- far track (peeks out) -->
    <path d="M66 58 L104 53 Q113 53 112 62 L110 68 L70 72 Z" fill="#2b2b2b"/>
    <!-- rear lift tower -->
    <path d="M94 22 L106 20 L109 50 L97 52 Z" fill="#e0a800"/>
    <!-- body side -->
    <path d="M50 44 L100 38 L102 60 L52 66 Z" fill="#f2b705"/>
    <path d="M70 50 L90 47.5 L90.5 54 L70.5 56.5 Z" fill="#1a1a1a" stroke-width="1.6"/>
    <g stroke="#f2b705" stroke-width="1.2"><path d="M74 49.5 V56"/><path d="M78 49 V55.5"/><path d="M82 48.5 V55"/><path d="M86 48 V54.5"/></g>
    <!-- body front -->
    <path d="M38 48 L50 44 L52 66 L40 70 Z" fill="#d49b00"/>
    <!-- cab: roof, side glass, front glass -->
    <path d="M40 22 L58 17 L86 14 L68 19 Z" fill="#f2b705"/>
    <path d="M58 17 L86 14 L88 40 L60 45 Z" fill="#2b2b2b"/>
    <path d="M62 20.5 L83 18 L84.5 37.5 L63.5 41.5 Z" fill="#9fd3f0" stroke-width="1.6"/>
    <path d="M73 19.5 L74.5 39.5" stroke-width="1.6"/>
    <path d="M40 22 L58 17 L60 45 L42 49 Z" fill="#2b2b2b"/>
    <path d="M44 25 L55.5 21.5 L57 42 L45.5 45 Z" fill="#9fd3f0" stroke-width="1.6"/>
    <!-- near track -->
    <path d="M44 66 L92 60 Q104 59 104 70 L102 76 Q100 83 90 83 L52 86 Q40 87 40 77 Z" fill="#2b2b2b"/>
    <path d="M50 70 L90 65.5 Q97 65.5 97 71 Q96 77 90 77.5 L54 80 Q47 80 47 75 Z" fill="#444" stroke-width="1.6"/>
    <g fill="#bdbdbd" stroke-width="1.4">
      <circle cx="56" cy="75" r="3"/><circle cx="66" cy="74" r="2.4"/><circle cx="76" cy="73" r="2.4"/><circle cx="90" cy="71" r="4.2"/>
    </g>
    <g stroke="#555" stroke-width="1.2"><path d="M46 86 L45 81"/><path d="M54 85.5 L53.5 80.5"/><path d="M62 85 L62 80"/><path d="M70 84.5 L70.5 79.5"/><path d="M78 84 L79 79"/><path d="M86 83.5 L87 78.5"/><path d="M98 80 L101 77"/></g>
    <!-- lift arm (near side) -->
    <path d="M104 24 L96 22 L56 36 L32 58 L39 62 L60 42 L104 31 Z" fill="#f2b705"/>
    <circle cx="99" cy="27" r="2.6" fill="#1a1a1a"/>
    <circle cx="36" cy="59.5" r="2" fill="#1a1a1a"/>
    <!-- bucket (open toward the front-left: back wall, side plate, floor, cutting edge) -->
    <path d="M15 50 L36 45 L41 68 L19 74 Z" fill="#4a4a4a"/>
    <path d="M18 74 L41 68 L31 75 L5 82 Z" fill="#9a9a9a"/>
    <path d="M15 50 L19 74 L5 82 Z" fill="#6e6e6e"/>
    <path d="M5 82 L31 75" stroke-width="3.2"/>
    <g stroke-width="1.8"><path d="M9 81 L7 84.5"/><path d="M15 79.5 L13 83"/><path d="M21 78 L19 81.5"/><path d="M27 76.5 L25 80"/></g>
  </g>
</svg>
