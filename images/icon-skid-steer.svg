<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Skid steer">
  <!-- Yellow wheeled skid steer, side view facing right -->
  <!-- body / engine -->
  <path d="M6 47 V35 Q6 31 10 31 H46 V47 Z" fill="#f2b705"/>
  <path d="M6 43 H46 V47 H6 Z" fill="#c99400"/>
  <!-- cab (cage + glass) -->
  <rect x="20" y="12" width="21" height="21" rx="2.5" fill="#2b2b2b"/>
  <rect x="23" y="15" width="15" height="15" rx="1" fill="#9fd3f0"/>
  <!-- rear lift tower -->
  <path d="M7 32 L11 20 H17 L17 32 Z" fill="#d9a300"/>
  <!-- lift arm -->
  <path d="M14 22 L43 18 L52 36" fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 22 L43 18 L52 36" fill="none" stroke="#c99400" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2)"/>
  <circle cx="14" cy="22" r="2" fill="#2b2b2b"/>
  <!-- tires -->
  <circle cx="15" cy="50" r="8" fill="#222"/>
  <circle cx="15" cy="50" r="3.6" fill="#9a9a9a"/>
  <circle cx="37" cy="50" r="8" fill="#222"/>
  <circle cx="37" cy="50" r="3.6" fill="#9a9a9a"/>
  <!-- bucket -->
  <path d="M49 32 Q54 31 57 35 L62 55 H47 Q46 41 49 32 Z" fill="#3a3a3a"/>
  <path d="M47 55 H63" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
</svg>
