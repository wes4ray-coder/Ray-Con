<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 540 540" role="img" aria-label="Ray Construction and Demolition logo">
  <!-- MASTER LOGO (as on the job-site sign): rounded red diamond, white italic "R".
       Hand-drawn vector, 600x600 design grid. Brand red #d4451f, R #ffffff.
       Variant with a see-through R: logo-knockout.svg (same geometry). -->
  <defs>
    <clipPath id="diamond">
      <rect x="95" y="95" width="410" height="410" rx="65" transform="rotate(45 300 300)"/>
    </clipPath>
  </defs>
  <g clip-path="url(#diamond)">
    <rect x="0" y="0" width="600" height="600" fill="#d4451f"/>
    <!-- R body: top bar + round bowl, italic stem, diagonal leg; runs off the diamond edges -->
    <path fill="#ffffff" fill-rule="evenodd" d="M155 154 H363 A109 109 0 0 1 363 372 H330 L570 600 H409 L195 397 L134 600 H21 Z
             M241 245 H340 Q360 245 360 265 V270 Q360 286 344 290 L212 342 Z"/>
  </g>
</svg>
