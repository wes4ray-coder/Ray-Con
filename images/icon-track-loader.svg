<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Compact track loader">
  <!-- Bobcat-style compact track loader, side view facing right -->
  <!-- track + rollers -->
  <rect x="6" y="45" width="42" height="13" rx="6.5" fill="#2b2b2b"/>
  <g fill="#8a8a8a">
    <circle cx="12.5" cy="51.5" r="3.2"/><circle cx="21.5" cy="51.5" r="2.4"/>
    <circle cx="29.5" cy="51.5" r="2.4"/><circle cx="41.5" cy="51.5" r="3.2"/>
  </g>
  <!-- body / engine -->
  <path d="M7 45 V35 Q7 32 10 32 H46 V45 Z" fill="#d4451f"/>
  <!-- cab (cage + glass) -->
  <rect x="21" y="13" width="21" height="20" rx="2.5" fill="#2b2b2b"/>
  <rect x="24" y="16" width="15" height="14" rx="1" fill="#9fd3f0"/>
  <!-- rear lift tower -->
  <path d="M8 33 L12 21 H17 L17 33 Z" fill="#b53a18"/>
  <!-- lift arm -->
  <path d="M14 23 L44 19 L53 37" fill="none" stroke="#d4451f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="14" cy="23" r="2" fill="#2b2b2b"/>
  <!-- bucket -->
  <path d="M50 33 Q55 32 58 36 L62 53 H48 Q47 41 50 33 Z" fill="#3a3a3a"/>
  <path d="M48 53 H63" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
</svg>
